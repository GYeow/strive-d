<svg xmlns="http://www.w3.org/2000/svg" width="99" height="22" viewBox="0 0 99 22" role="img" aria-labelledby="title">
  <title id="title">NeurIPS 2026</title>
  <defs>
    <clipPath id="badge"><rect width="99" height="22" rx="3"/></clipPath>
    <linearGradient id="shine" x2="0" y2="100%">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".06"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#badge)">
    <rect width="57" height="22" fill="#FAFAFA"/>
    <rect x="57" width="42" height="22" fill="#8D7BA8"/>
    <rect width="99" height="22" fill="url(#shine)"/>
  </g>
  <rect x=".5" y=".5" width="98" height="21" rx="2.5" fill="none" stroke="#000" stroke-opacity=".10"/>
  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle">
    <text x="28.5" y="15" fill="#333">NeurIPS</text>
    <text x="78" y="15" fill="#fff">2026</text>
  </g>
</svg>
